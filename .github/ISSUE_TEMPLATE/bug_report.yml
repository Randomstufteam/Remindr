name: Bug report
description: Something in Remindr isn't working
labels: ["bug"]
body:
  - type: input
    id: app-version
    attributes:
      label: Remindr version
      description: Filled in for you when you use Settings > Report a bug.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Filled in for you when you use Settings > Report a bug.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Please hide anything personal first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal info (names, file paths, reminder text) from this report.
          required: true
